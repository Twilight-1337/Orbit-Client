[package]
name = "orbit-client"
version = "0.1.0"
edition = "2021"
description = "Orbit Client — a lightweight, security-focused Minecraft launcher"
license = "MIT"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "time", "process", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream", "http2"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "serde-well-known"] }
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
